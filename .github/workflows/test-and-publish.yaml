name: Publish new release for @algoan/eslint-config

on:
  push:
    branches: [master]

permissions:
  # Push the release commit and tag, and create the GitHub Release
  contents: write
  # semantic-release comments on released issues and pull requests
  issues: write
  pull-requests: write
  # Publish to GitHub Packages
  packages: write
  # Mint the OIDC token used to publish to npmjs.com without a long-lived token
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    name: Publish @algoan/eslint-config to NPM
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "npm"
      - run: npm i -g npm
      - run: npm ci --legacy-peer-deps
      - run: npm test
        name: Check the shared configuration loads with ESLint
      - run: npm run semantic-release
        name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_NPM_CONFIG_REGISTRY: https://npm.pkg.github.com/
          GITHUB_NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No NPM_NPM_TOKEN: npmjs.com authentication goes through OIDC trusted
          # publishing, configured on the package settings at npmjs.com.
          NPM_NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
